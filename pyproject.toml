[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indexcase"
version = "0.1.0.dev0"
description = "Trace malware propagation and identify patient zero in Active Directory from offline Windows event logs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "spryzz3n" }]
dependencies = [
    "evtx>=0.8",
    "polars>=1.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/indexcase"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
